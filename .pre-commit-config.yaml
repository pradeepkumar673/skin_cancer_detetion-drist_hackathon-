repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '\.(json|md)$'
      - id: trailing-whitespace
        exclude: '\.(json|md)$'
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^ai-service/.*\.py$
      - id: ruff-format
        files: ^ai-service/.*\.py$

  - repo: local
    hooks:
      - id: block-storage-photos
        name: Block patient photos from being committed
        entry: bash -c 'git diff --cached --name-only | grep -E "^storage/.*\.(jpg|jpeg|png|webp)$" && echo "Patient photos must not be committed." && exit 1 || exit 0'
        language: system
        pass_filenames: false
