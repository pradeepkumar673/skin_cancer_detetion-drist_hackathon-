# Clinical rules and evidence-based decision support thresholds
# Note: Decision support only. A doctor makes the diagnosis.

version: "1.0.0"

cancer:
  abcde:
    border:
      compactness_weight: 0.6
      solidity_weight: 0.4
    thresholds:
      asymmetry_high: 0.45
      border_high: 0.60
      color_high: 0.50
      diameter_mm_alert: 6.0
  urgency_mapping:
    low: "monitor"
    moderate: "routine_visit"
    high: "urgent_visit"
    very_high: "urgent_visit"
  warning_signs:
    escalate_on_ugly_duckling: true
    escalate_on_rapid_evolution: true
  evolution_weights:
    # Heuristic clinical weights for longitudinal evolution score
    area_weight: 0.35
    color_weight: 0.25
    border_weight: 0.20
    embedding_weight: 0.20

ulcer:
  healing_trajectory:
    healed_area_reduction_weekly_pct: 10.0
    stalled_area_reduction_4weeks_pct: 50.0
  red_flags:
    necrotic_fraction_threshold: 0.20
    slough_fraction_threshold: 0.40
    periwound_redness_ratio_threshold: 1.35
    area_expansion_pct_threshold: 15.0
  tissue_colors:
    # Heuristic HSV color classification for wound tissue bed
    granulation:
      hsv_lower_1: [0, 60, 60]
      hsv_upper_1: [15, 255, 255]
      hsv_lower_2: [165, 60, 60]
      hsv_upper_2: [180, 255, 255]
    slough:
      hsv_lower: [18, 40, 80]
      hsv_upper: [45, 255, 255]
    necrotic:
      hsv_lower: [0, 0, 0]
      hsv_upper: [180, 255, 55]

disease:
  abstain_confidence_threshold: 0.40
  top_n_candidates: 3
